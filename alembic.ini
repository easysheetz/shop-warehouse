# Migracje bazy danych (Alembic).
# Adres bazy NIE jest tu wpisany – migrations/env.py bierze go z DATABASE_URL (.env lub zmienne środowiska).
#
#   alembic upgrade head                              – zastosuj wszystkie migracje
#   alembic revision --autogenerate -m "opis zmiany"  – nowa migracja po zmianie app/models.py
#   alembic check                                     – czy modele zgadzają się z migracjami

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
