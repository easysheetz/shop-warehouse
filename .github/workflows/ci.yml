# Sprawdzenie każdej zmiany: pull request do main i każdy push do main.
# Wdrażanie (tagi v*) dojdzie w fazie 2 jako osobny plik deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Testy i jakość kodu
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skaner
          POSTGRES_PASSWORD: skaner
          POSTGRES_DB: skaner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skaner"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://skaner:skaner@localhost:5432/skaner_test
      DATABASE_URL: postgresql+psycopg://skaner:skaner@localhost:5432/skaner_test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks sprawdza całą historię

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalacja zależności
        run: pip install -r requirements-dev.txt

      - name: Pre-commit (skan sekretów, ruff, formatowanie plików)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Migracje – zgodność z modelami
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Testy
        run: pytest -q

  docker:
    name: Budowa obrazu Dockera
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: skaner-magazyn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
